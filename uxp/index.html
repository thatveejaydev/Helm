<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
  </head>
  <body>
    <section>
      <h2>Helm Bridge</h2>
      <p id="status">Open Helm on your desktop to pair.</p>
      <label for="key">Pairing key from Helm settings</label>
      <input id="key" type="password" placeholder="Paste pairing key" />
      <div class="actions">
        <button id="connect">Connect</button>
        <button id="refresh">Refresh effects</button>
        <button id="reload">Reload plugin</button>
      </div>
    </section>
  </body>
</html>
