<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
    <script src="main.js"></script>
  </head>
  <body>
    <section>
      <div class="heading">
        <span class="brand-mark" aria-hidden="true">H</span>
        <h2>Helm Bridge</h2>
      </div>
      <div class="connection">
        <span id="connection-dot" class="connection-dot" aria-hidden="true"></span>
        <p id="status" role="status">Waiting for the Helm desktop app…</p>
      </div>
      <div class="actions">
        <sp-button id="refresh" variant="secondary" size="s">Refresh effects</sp-button>
        <sp-button id="reload" quiet variant="secondary" size="s">Reload plugin</sp-button>
      </div>
    </section>
  </body>
</html>
